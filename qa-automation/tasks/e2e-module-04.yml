---
# module-04: ensures Application/weathernow-lab and its source exist (resetting
# weathernow/ to the baseline source so the fault is reproducible), commits a
# readinessProbe on port 18080, waits for a pod that is Running but not Ready on
# a ReplicaSet with zero ready replicas, then repairs the probe to `http` and
# proves the app recovers. The Lightspeed prompt, Perses panels, console evidence
# and the manual Gitea editor are not run.
# Depends on: module 2 (the workspace clone and Argo CD in <user>-gitops).

- name: Module 4 - AI-assisted incident investigation
  block:

    - name: Check the Module 2 workspace clone
      ansible.builtin.stat:
        path: "{{ e2e_workspace_dir }}/.git"
      register: m4_repo

    - name: 'module-04: the workspace clone must exist'
      ansible.builtin.assert:
        that: m4_repo.stat.exists | default(false)
        fail_msg: >-
          {{ e2e_workspace_dir }} is not a git clone. Module 4 edits the clone
          module 2 makes, so run modules 1 to 4 in the same invocation.

    - name: Ensure the WeatherNow source directory exists in the student repository
      ansible.builtin.file:
        path: "{{ e2e_workspace_dir }}/weathernow"
        state: directory

    - name: Write the WeatherNow baseline source into the student repository
      ansible.builtin.copy:
        dest: "{{ e2e_workspace_dir }}/weathernow/{{ item.name }}"
        content: "{{ item.content }}"
        force: true
      loop:
        - name: kustomization.yaml
          content: |
            apiVersion: kustomize.config.k8s.io/v1beta1
            kind: Kustomization
            resources:
              - weathernow.yaml
        - name: weathernow.yaml
          content: |
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: weathernow
              labels:
                app: weathernow
                app.kubernetes.io/part-of: weathernow-lab
            spec:
              replicas: 1
              selector:
                matchLabels:
                  app: weathernow
              template:
                metadata:
                  labels:
                    app: weathernow
                    app.kubernetes.io/part-of: weathernow-lab
                spec:
                  containers:
                    - name: weathernow
                      image: quay.io/openshift-workshop-applications/weathernow:latest
                      imagePullPolicy: IfNotPresent
                      ports:
                        - name: http
                          containerPort: 8080
                      readinessProbe:
                        tcpSocket:
                          port: http
                        initialDelaySeconds: 5
                        periodSeconds: 10
                      livenessProbe:
                        tcpSocket:
                          port: http
                        initialDelaySeconds: 15
                        periodSeconds: 20
                      resources:
                        requests:
                          cpu: 25m
                          memory: 32Mi
                        limits:
                          cpu: 200m
                          memory: 128Mi
            ---
            apiVersion: v1
            kind: Service
            metadata:
              name: weathernow
              labels:
                app: weathernow
                app.kubernetes.io/part-of: weathernow-lab
            spec:
              selector:
                app: weathernow
              ports:
                - name: http
                  port: 8080
                  targetPort: http
            ---
            apiVersion: route.openshift.io/v1
            kind: Route
            metadata:
              name: weathernow
              labels:
                app: weathernow
                app.kubernetes.io/part-of: weathernow-lab
            spec:
              to:
                kind: Service
                name: weathernow
              port:
                targetPort: http
              tls:
                termination: edge
                insecureEdgeTerminationPolicy: Redirect

    - name: Stage the WeatherNow source
      ansible.builtin.command:
        argv: [git, add, weathernow]
        chdir: "{{ e2e_workspace_dir }}"
      changed_when: false

    - name: Check whether the WeatherNow source changed
      ansible.builtin.command:
        argv: [git, diff, --cached, --quiet]
        chdir: "{{ e2e_workspace_dir }}"
      register: m4_staged
      changed_when: false
      failed_when: false

    - name: Commit the WeatherNow baseline source
      ansible.builtin.command:
        argv: [git, commit, -m, "lab(weather): add or reset WeatherNow GitOps source"]
        chdir: "{{ e2e_workspace_dir }}"
      when: m4_staged.rc | default(0) != 0
      changed_when: true

    - name: Push the WeatherNow baseline source
      ansible.builtin.command:
        argv: [git, push, origin, main]
        chdir: "{{ e2e_workspace_dir }}"
      when: m4_staged.rc | default(0) != 0
      changed_when: true
      no_log: true

    - name: Ensure Application/weathernow-lab exists
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: "{{ e2e_weather_app }}"
            namespace: "{{ e2e_gitops_ns }}"
          spec:
            project: default
            source:
              repoURL: "https://{{ e2e_gitea_host }}/{{ e2e_user }}/{{ e2e_workspace_repo }}.git"
              targetRevision: main
              path: weathernow
            destination:
              server: https://kubernetes.default.svc
              namespace: "{{ e2e_gitops_ns }}"
            syncPolicy:
              automated:
                enabled: true
                prune: false
                selfHeal: true
              retry:
                limit: 5
                backoff:
                  duration: 10s
                  factor: 2
                  maxDuration: 2m

    - name: Wait for weathernow-lab to be Synced/Healthy
      ansible.builtin.command:
        argv:
          - oc
          - get
          - application
          - "{{ e2e_weather_app }}"
          - -n
          - "{{ e2e_gitops_ns }}"
          - -o
          - 'jsonpath={.status.sync.status}/{.status.health.status}'
      register: m4_baseline
      until: m4_baseline.stdout == 'Synced/Healthy'
      retries: "{{ e2e_retries }}"
      delay: "{{ e2e_poll_delay }}"
      changed_when: false
      failed_when: false

    - name: Wait for the WeatherNow rollout
      ansible.builtin.command:
        argv: [oc, rollout, status, deployment/weathernow, -n, "{{ e2e_gitops_ns }}", --timeout=300s]
      register: m4_baseline_rollout
      changed_when: false
      failed_when: false

    - name: Read the WeatherNow Route host
      ansible.builtin.command:
        argv: [oc, get, route, weathernow, -n, "{{ e2e_gitops_ns }}", -o, "jsonpath={.spec.host}"]
      register: m4_route
      changed_when: false
      failed_when: false

    - name: 'module-04: the WeatherNow Route must exist'
      ansible.builtin.assert:
        that: m4_route.stdout | default('') | length > 0
        fail_msg: >-
          Route weathernow is missing in {{ e2e_gitops_ns }}. A learner would
          have no HTTP baseline for the incident.

    - name: Read the WeatherNow baseline HTTP response
      ansible.builtin.uri:
        url: "https://{{ m4_route.stdout }}/"
        validate_certs: false
        timeout: 30
        status_code: 200
      register: m4_baseline_http
      until: m4_baseline_http.status | default(0) == 200
      retries: "{{ e2e_retries }}"
      delay: "{{ e2e_poll_delay }}"
      changed_when: false
      failed_when: false

    - name: 'module-04: WeatherNow must be healthy before the fault'
      ansible.builtin.assert:
        that:
          - m4_baseline.stdout | default('') == 'Synced/Healthy'
          - m4_baseline_rollout.rc | default(1) == 0
          - m4_baseline_http.status | default(0) == 200
        fail_msg: >-
          WeatherNow did not reach a healthy baseline before the fault: Argo
          '{{ m4_baseline.stdout }}', rollout rc={{ m4_baseline_rollout.rc | default('n/a') }},
          HTTP {{ m4_baseline_http.status | default('n/a') }}. A learner would be
          debugging an existing failure instead of the readiness mistake.

    - name: Break the WeatherNow readiness probe in the student source
      ansible.builtin.replace:
        path: "{{ e2e_workspace_dir }}/weathernow/weathernow.yaml"
        regexp: '(\n *readinessProbe:\n *tcpSocket:\n *port: )http'
        replace: '\g<1>18080'

    - name: Commit the Module 4 readiness fault
      ansible.builtin.command:
        argv: [git, commit, -am, "lab(module04): break WeatherNow readiness for agentic diagnosis"]
        chdir: "{{ e2e_workspace_dir }}"
      register: m4_commit
      changed_when: m4_commit.rc == 0
      failed_when: m4_commit.rc not in [0, 1]

    - name: Push the Module 4 readiness fault
      ansible.builtin.command:
        argv: [git, push, origin, main]
        chdir: "{{ e2e_workspace_dir }}"
      when: m4_commit.rc | default(1) == 0
      changed_when: true
      no_log: true

    - name: Read the Module 4 fault commit
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: "{{ e2e_workspace_dir }}"
      register: m4_fault_head
      changed_when: false

    - name: Wait for Argo CD to apply the Module 4 fault revision
      ansible.builtin.command:
        argv:
          - oc
          - get
          - application
          - "{{ e2e_weather_app }}"
          - -n
          - "{{ e2e_gitops_ns }}"
          - -o
          - 'jsonpath={.status.sync.revision}'
      register: m4_fault_revision
      until: (m4_fault_revision.stdout | default('')) == (m4_fault_head.stdout | trim)
      retries: "{{ e2e_retries }}"
      delay: "{{ e2e_poll_delay }}"
      changed_when: false
      failed_when: false

    - name: Wait for a WeatherNow pod that is Running but not Ready
      ansible.builtin.command:
        argv:
          - oc
          - get
          - pods
          - -n
          - "{{ e2e_gitops_ns }}"
          - -l
          - app=weathernow
          - -o
          - 'jsonpath={range .items[*]}{.metadata.name}:{.status.phase}:{.status.containerStatuses[0].ready}{"\n"}{end}'
      register: m4_pods
      until: "'Running:false' in (m4_pods.stdout | default(''))"
      retries: "{{ e2e_retries }}"
      delay: "{{ e2e_poll_delay }}"
      changed_when: false
      failed_when: false

    - name: Record the Running-but-not-Ready pod
      ansible.builtin.set_fact:
        m4_bad_pod: "{{ (m4_pods.stdout_lines | default([]) | select('search', 'Running:false') | list | first | default('::')).split(':')[0] }}"

    - name: Read the live WeatherNow readiness probe port
      ansible.builtin.command:
        argv:
          - oc
          - get
          - deployment
          - weathernow
          - -n
          - "{{ e2e_gitops_ns }}"
          - -o
          - 'jsonpath={.spec.template.spec.containers[0].readinessProbe.tcpSocket.port}'
      register: m4_probe
      changed_when: false
      failed_when: false

    - name: Read the failing pod's ReplicaSet
      ansible.builtin.command:
        argv:
          - oc
          - get
          - pod
          - "{{ m4_bad_pod }}"
          - -n
          - "{{ e2e_gitops_ns }}"
          - -o
          - 'jsonpath={.metadata.ownerReferences[0].kind}/{.metadata.ownerReferences[0].name}'
      register: m4_owner
      when: m4_bad_pod | length > 0
      changed_when: false
      failed_when: false

    - name: Read the failing ReplicaSet's ready replicas
      ansible.builtin.command:
        argv:
          - oc
          - get
          - replicaset
          - "{{ (m4_owner.stdout | default('/')).split('/')[1] }}"
          - -n
          - "{{ e2e_gitops_ns }}"
          - -o
          - 'jsonpath={.status.readyReplicas}'
      register: m4_rs_ready
      when: (m4_owner.stdout | default('')).startswith('ReplicaSet/')
      changed_when: false
      failed_when: false

    - name: 'module-04: the new revision must be Running but not Ready'
      ansible.builtin.assert:
        that:
          - m4_bad_pod | default('') | length > 0
          - (m4_probe.stdout | default('')) == (e2e_weather_probe_port_bad | string)
          - (m4_owner.stdout | default('')).startswith('ReplicaSet/')
          - (m4_rs_ready.stdout | default('')) in ['', '0']
        fail_msg: >-
          The readiness fault did not reach the live objects: probe
          '{{ m4_probe.stdout }}', unready pod '{{ m4_bad_pod }}', owner
          '{{ m4_owner.stdout }}', ready replicas '{{ m4_rs_ready.stdout }}'. A
          learner would see a rollout that is either already green or stuck for a
          different reason. Check the commit, Argo revision and the ReplicaSet.

    - name: Restore the WeatherNow readiness probe in the student source
      ansible.builtin.replace:
        path: "{{ e2e_workspace_dir }}/weathernow/weathernow.yaml"
        regexp: '(\n *readinessProbe:\n *tcpSocket:\n *port: )18080'
        replace: '\g<1>http'

    - name: Commit the Module 4 repair
      ansible.builtin.command:
        argv: [git, commit, -am, "fix(module04): restore WeatherNow readiness probe"]
        chdir: "{{ e2e_workspace_dir }}"
      register: m4_repair_commit
      changed_when: m4_repair_commit.rc == 0
      failed_when: m4_repair_commit.rc not in [0, 1]

    - name: Push the Module 4 repair
      ansible.builtin.command:
        argv: [git, push, origin, main]
        chdir: "{{ e2e_workspace_dir }}"
      when: m4_repair_commit.rc | default(1) == 0
      changed_when: true
      no_log: true

    - name: Read the Module 4 repair commit
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
        chdir: "{{ e2e_workspace_dir }}"
      register: m4_repair_head
      changed_when: false

    - name: Wait for Argo CD to apply and heal the Module 4 repair
      ansible.builtin.command:
        argv:
          - oc
          - get
          - application
          - "{{ e2e_weather_app }}"
          - -n
          - "{{ e2e_gitops_ns }}"
          - -o
          - 'jsonpath={.status.sync.revision}/{.status.sync.status}/{.status.health.status}'
      register: m4_repaired
      until: >-
        (m4_repaired.stdout | default('')) ==
        ((m4_repair_head.stdout | trim) ~ '/Synced/Healthy')
      retries: "{{ e2e_retries }}"
      delay: "{{ e2e_poll_delay }}"
      changed_when: false
      failed_when: false

    - name: Wait for the repaired WeatherNow rollout
      ansible.builtin.command:
        argv: [oc, rollout, status, deployment/weathernow, -n, "{{ e2e_gitops_ns }}", --timeout=300s]
      register: m4_repair_rollout
      changed_when: false
      failed_when: false

    - name: Read the repaired WeatherNow readiness probe port
      ansible.builtin.command:
        argv:
          - oc
          - get
          - deployment
          - weathernow
          - -n
          - "{{ e2e_gitops_ns }}"
          - -o
          - 'jsonpath={.spec.template.spec.containers[0].readinessProbe.tcpSocket.port}'
      register: m4_probe_fixed
      changed_when: false
      failed_when: false

    - name: Read the WeatherNow repaired HTTP response
      ansible.builtin.uri:
        url: "https://{{ m4_route.stdout }}/"
        validate_certs: false
        timeout: 30
        status_code: 200
      register: m4_repaired_http
      until: m4_repaired_http.status | default(0) == 200
      retries: "{{ e2e_retries }}"
      delay: "{{ e2e_poll_delay }}"
      changed_when: false
      failed_when: false

    - name: 'module-04: the repair must heal WeatherNow'
      ansible.builtin.assert:
        that:
          - (m4_repaired.stdout | default('')) == ((m4_repair_head.stdout | trim) ~ '/Synced/Healthy')
          - m4_probe_fixed.stdout | default('') == e2e_weather_probe_port_good
          - m4_repair_rollout.rc | default(1) == 0
          - m4_repaired_http.status | default(0) == 200
        fail_msg: >-
          The repair did not heal WeatherNow: Argo '{{ m4_repaired.stdout }}',
          probe '{{ m4_probe_fixed.stdout }}', rollout rc={{ m4_repair_rollout.rc | default('n/a') }},
          HTTP {{ m4_repaired_http.status | default('n/a') }}. A learner would
          finish with a pod that is still not Ready or no working Route.

    - name: 'module-04: not verified'
      ansible.builtin.debug:
        msg: >-
          NOT VERIFIED: the Lightspeed troubleshooting prompt and tool results,
          the Perses dashboard, the console pod/event views and the Gitea web
          editor. The diagnosis was validated from the live probe, pod and
          ReplicaSet state.
