---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.clusterObservability.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    # "Enable Operator recommended cluster monitoring on this Namespace",
    # as required by the documented COO installation procedure.
    openshift.io/cluster-monitoring: "true"
