{{- if .Values.perses.enabled }}
---
# SECURITY TRADEOFF — READ BEFORE ENABLING
# The Perses datasource queries Thanos Querier as the logged-in student, and
# Thanos only authorises callers holding cluster-monitoring-view. Granting that
# role means every student can read metrics for ALL namespaces on the cluster,
# not just their own (measured: 47 namespaces visible with this role).
# This contradicts Module 2's tenant-isolation lesson and the rule in
# docs/instructor/cluster-observability-workshop-preflight.md.
# A tenant-scoped metrics proxy is the alternative that preserves isolation.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.username }}-cluster-monitoring-view
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: {{ .Values.username }}
{{- end }}
