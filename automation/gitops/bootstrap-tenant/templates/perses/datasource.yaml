{{- if .Values.perses.enabled }}
---
# Thanos checks the requesting user's access to the namespace in the URL.
apiVersion: perses.dev/v1alpha2
kind: PersesDatasource
metadata:
  name: workshop-workloads
  namespace: {{ .Values.username }}-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  config:
    default: true
    display:
      name: "Workshop metrics (GitOps project)"
    plugin:
      kind: PrometheusDatasource
      spec:
        proxy:
          kind: HTTPProxy
          spec:
            url: "https://thanos-querier.openshift-monitoring.svc.cluster.local:9092?namespace={{ .Values.username }}-gitops"
            # Perses Operator generates this project-local TLS configuration
            # from client.tls below. The HTTP proxy must reference it by name.
            secret: workshop-workloads-secret
  client:
    tls:
      enable: true
      caCert:
        type: file
        certPath: /ca/service-ca.crt
{{- end }}
