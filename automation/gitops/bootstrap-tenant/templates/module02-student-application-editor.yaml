---
# Allow each student to manage only Application CRs in their own
# GitOps project, without granting direct write access to Deployments,
# Secrets, PVCs or cluster-scoped Namespace creation.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: module02-application-editor
  namespace: {{ .Values.username }}-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: module02-application-editor
  namespace: {{ .Values.username }}-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
subjects:
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: {{ .Values.username | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: module02-application-editor
