---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lb1858-student-agentic-runs
  namespace: {{ printf "%s-gitops" .Values.username | quote }}
rules:
  - apiGroups: ["agentic.openshift.io"]
    resources: ["agenticruns"]
    verbs: ["create", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lb1858-student-agentic-runs
  namespace: {{ printf "%s-gitops" .Values.username | quote }}
subjects:
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: {{ .Values.username | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lb1858-student-agentic-runs
