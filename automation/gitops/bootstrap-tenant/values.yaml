deployer:
  domain: apps.example.com

username: user1

agenticRunConsole:
  # On dedicated LB1858 clusters the console lists runs across all projects.
  # Disable this in clusters where students must not see other projects' runs.
  clusterList: true

gitea:
  dataSize: 1Gi
  adminPassword: openshift
  password: openshift
  migrateRepos:
    # Each student gets an editable copy of the flat GitOps workspace. Only
    # the manifests Argo CD applies live there; the Showroom content and
    # automation stay in the lab repository.
    # The upstream workspace must exist before provisioning new students.
    # Existing Gitea CRs do NOT automatically import newly added repositories.
    # See docs/instructor/gitea-repository-migration.md.
    - name: openshift-5-container-workspace
      url: https://github.com/rhpds/openshift-5-container-workspace
      private: false
