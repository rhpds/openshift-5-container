deployer:
  domain: apps.example.com

username: user1

gitea:
  dataSize: 1Gi
  adminPassword: openshift
  password: openshift
  migrateRepos:
    - name: openshift-starter-guides
      url: https://github.com/redhat-scholars/openshift-starter-guides
      private: false
    # Module 2: each student gets an editable copy containing the safe
    # content/modules/ROOT/examples/module02-gitops Kustomize source.
    # The upstream GitOps source must exist before provisioning new students.
    # Existing Gitea CRs do NOT automatically import newly added repositories.
    # See docs/instructor/gitea-repository-migration.md.
    - name: openshift-5-container
      url: https://github.com/rhpds/openshift-5-container
      private: false

# Per-student quota shared by all namespaces with the student's requester
# annotation. Sized for Argo CD, Gitea and the Module 1 National Parks app.
tenantQuota:
  enabled: true
  hard:
    limits.cpu: "8"
    requests.cpu: "4"
    limits.memory: 12Gi
    requests.memory: 8Gi
    requests.storage: 20Gi
