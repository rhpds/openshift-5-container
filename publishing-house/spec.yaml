# Publishing House — Project Spec
# Lifecycle: intake → content_review → infra_review → jira_sync → development → ready → published
# No secrets in this file. Tokens live in ~/.config/publishing-house/auth.json
# Stage is managed by SonataFlow and cached in .ph-state — do not edit stage.current manually.
# NOTE: This file is also in the template repo. The Scaffolder overlays project.* values.
# TODO: Eliminate this copy — Scaffolder should pull from template repo directly.

project:
  slug: "openshift-5-container"
  owner_email: "jboeselm@redhat.com"
  content_type: "lab"
  deployment_mode: "rhdp_published"
  initiative_key: "rh1_2027"
  showroom_type: "classic"
  intake_type: "new"
  automation_type: "gitops"
  description: "This hands-on lab puts attendees in the role of a platform team responsible for onboarding and operating applications on a shared OpenShift environment. They will use GitOps to onboard an application, apply access, network and resource controls, and manage workloads competing for shared platform resources.  A production issue will then be introduced and attendees will use metrics, logs, events, traces and OpenShift 5 AI-assisted capabilities to investigate the problem. They will need to validate the AI recommendations, identify the root cause and implement the final fix through GitOps.  The lab will also cover improvements carried forward from OpenShift 4 around platform management, observability, multitenancy, workload management and application lifecycle. "
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "RHDPCD-1227"
  workflow_id: "1bd7e8aa-4f1c-41be-96fa-b247a9b05471"

spec:
  title: "Operating Applications on OpenShift 5: Platform Engineering, AI & GitOps"
  learning_objectives:
    - "Configure application onboarding through GitOps (ArgoCD), including namespace, RBAC, and NetworkPolicy creation"
    - "Verify tenant isolation holds between student namespaces after onboarding"
    - "Manage resource contention across shared workloads using ResourceQuotas, LimitRanges, and PriorityClasses"
    - "Analyze workload resource usage on a shared cluster and right-size deployments accordingly"
    - "Troubleshoot an injected production incident using OpenShift Lightspeed together with metrics, logs, and traces"
    - "Verify OpenShift Lightspeed's recommendations against real cluster data before acting on them"
    - "Implement a validated fix declaratively through GitOps and confirm recovery"
    - "Monitor rollout health and ArgoCD sync status while performing a rolling update"
  modules:              # [{id, title, duration_min}] — written by intake Phase 4; id is stable (e.g. module-01)
    - id: module-01
      title: "What's New in OCP 5"
      duration_min: 20
      status: not_started
    - id: module-02
      title: "GitOps Onboarding & Multitenancy"
      duration_min: 20
      status: not_started
    - id: module-03
      title: "Workload Management & Resource Controls"
      duration_min: 20
      status: not_started
    - id: module-04
      title: "AI-Assisted Incident Investigation"
      duration_min: 40
      status: not_started
    - id: module-05
      title: "GitOps Remediation & App Lifecycle"
      duration_min: 20
      status: not_started
  environment:
    platform: "ocp"               # ocp | rhel-vms — determines which sizing fields apply
    topology: "shared-cluster"               # shared-cluster | per-student | cnv-pool
    cloud_provider: cnv        # cnv | aws | troshka — cnv is default
    max_concurrent_users: 30 # required if topology = shared-cluster

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: "5.0"                    # e.g. 4.20 — minimum 4.20; leave empty for rhel-vms
    cluster_type: "multinode"                   # sno | multinode — only for platform = ocp
    control_plane_instance_count: 3 # 1 if sno, 3 if multinode
    control_plane_cpu: 16            # 32 if sno, 16 if multinode
    control_plane_ram_gb: 64            # 128 if sno, 64 if multinode
    worker_count: 4                 # number of OCP worker nodes
    worker_cpu: 16                 # vCPU per worker
    worker_ram_gb: 64                # RAM per worker in GB
    worker_disk_gb: 100               # disk per worker in GB

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os}
    vms_per_student: []

    # --- Common fields (both platforms) ---
    aap_version: ""                    # required if AAP in products
    ai_requirement: "none"                 # maas | gpu | none
    ai_model_tier: ""                  # open-source | frontier (if ai_requirement = maas or gpu)
    ai_model_name: ""                  # specific model e.g. granite-3.1-8b
    ai_justification: ""               # required if ai_model_tier = frontier or ai_requirement = gpu
    non_ga_products: ["Red Hat OpenShift Container Platform 5.x"]                # list of non-GA products/versions
    non_ga_access_plan: "TBD — pending OCP 5.x availability on the CNV pool"             # how access is provided for non-GA products
    external_services: ["registry.redhat.io", "llm-gpt4-lightspeed.cognitiveservices.azure.com"]              # named external service dependencies e.g. [github.com]
    gpu_nodes: 0                       # number of GPU nodes (0 = none)
    gpu_type: ""                       # e.g. NVIDIA A100 40GB (required if gpu_nodes > 0)
  duration_hours: 2
  audience: "intermediate"               # beginner | intermediate | advanced

development:
  automation:
    gitops:
      status: not_started
  e2e:
    status: not_started
  healthCheck:
    status: not_started

compliance:
  last_hard_check: null
  hard_result: null

tracking:
  paused: false
  pause_reason: null

# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: false
    assessment_strategy: "Trust-based — no solve/validate automation. Students confirm success visually via the OpenShift console (tenant isolation, resource dashboards, ArgoCD sync status, application recovery)."
    catalog_gap: "Existing catalog labs cover GitOps/multitenancy (Advanced GitOps Workshop, DevSecOps Roadshow) or broader platform-onboarding stories (Unlocking OpenShift's Full Value) individually, but none combine shared-workload resource contention management with AI-assisted incident investigation validated against real cluster data in one intermediate, ~2-hour flow. This lab also evolves the existing platform-engineering-workshop CNV pattern (upgraded to multi-user) rather than duplicating it."
    design_overview: "This intermediate, ~2-hour lab puts attendees in the role of a platform team onboarding and operating an application on a shared, multi-user OpenShift 5 cluster. After a brief orientation on OCP 4→5 platform improvements, attendees onboard an app through GitOps, enforce multitenancy and manage resource contention with quotas and priority classes, then investigate an injected production incident using OpenShift Lightspeed alongside metrics/logs/events/traces — validating the AI's recommendations against real cluster data before pushing the fix back through GitOps."
    module_summaries:
      - title: "What's New in OCP 5"
        overview: "A presenter-led orientation (no hands-on) covering OCP 4→5 improvements in platform management, observability, multitenancy, and workload lifecycle, framing the platform-team scenario for the rest of the lab."
      - title: "GitOps Onboarding & Multitenancy"
        overview: "Students onboard the sample application via GitOps (ArgoCD) by declaring namespace, RBAC, and NetworkPolicy manifests, then verify tenant isolation holds against a neighboring namespace."
      - title: "Workload Management & Resource Controls"
        overview: "Students apply ResourceQuotas, LimitRanges, and PriorityClasses to manage contention on the shared cluster, then analyze actual usage and right-size their deployment."
      - title: "AI-Assisted Incident Investigation"
        overview: "Students investigate an injected production incident using OpenShift Lightspeed together with metrics, logs, events, and traces, validating the AI's recommendations against real cluster data before converging on a fix."
      - title: "GitOps Remediation & App Lifecycle"
        overview: "Students push the validated fix back through GitOps, monitor the ArgoCD sync and rollout, and confirm the application has recovered from the incident."
    rcars_overlap_pct: 83
    rcars_top_matches:
      - title: "OpenShift Advanced GitOps Workshop"
        ci_name: "sandboxes-gpte.ocp-advanced-gitops.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=sandboxes-gpte.ocp-advanced-gitops.prod"
        relevance_score: 83
        why_it_fits: "This workshop directly addresses GitOps-driven multitenancy enforcement through its deep coverage of Argo CD RBAC, AppProjects, and multi-tenant configurations, and its ApplicationSets and App-of-Apps modules align well with application onboarding patterns on OpenShift."
      - title: "Unlocking OpenShift's Full Value"
        ci_name: "published.ocp-app-platform-roi.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=published.ocp-app-platform-roi.prod"
        relevance_score: 74
        why_it_fits: "This lab covers GitOps with Argo CD and OpenShift GitOps as part of a broader application platform story, giving participants hands-on experience with GitOps-driven deployments and configuration drift remediation."
        workloads:
          - role: "ocp4_app_platform_roi"
            collection: "rhdp.workshop"
          - role: "ocp4_workload_authentication"
            collection: "agnosticd.core_workloads"
          - role: "ocp4_workload_cert_manager"
            collection: "agnosticd.core_workloads"
          - role: "ocp4_workload_external_odf"
            collection: "agnosticd.core_workloads"
          - role: "ocp4_workload_litellm_virtual_keys"
            collection: "rhpds.litellm_virtual_keys"
          - role: "ocp4_workload_multi_tenant_loop"
            collection: "agnosticd.core_workloads"
          - role: "ocp4_workload_ocp_console_embed"
            collection: "agnosticd.showroom"
          - role: "ocp4_workload_openshift_gitops"
            collection: "agnosticd.core_workloads"
      - title: "OpenShift DevSecOps Roadshow"
        ci_name: "sandboxes-gpte.ocp-devops-roadshow.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=sandboxes-gpte.ocp-devops-roadshow.prod"
        relevance_score: 70
        why_it_fits: "This workshop directly covers GitOps-driven application deployment with Argo CD, multi-tenant GitOps enforcement (Argo CD RBAC, AppProjects, Apps in Any Namespace), and configuration drift remediation, aligning well with the core GitOps onboarding and multitenancy topics requested."
    rejections: []

  infra:
    peak_environments: null
    cost_per_run_est: ""
    provisioning_time_est: ""
    agnosticv_base_ci: ""
    approved_by: ""
    rejections: []
