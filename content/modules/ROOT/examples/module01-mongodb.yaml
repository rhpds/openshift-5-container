# Working MongoDB 8 for the National Parks workshop.
# Intentional lab fault: MongoDB Service targetPort is 27018 but mongod listens on 27017.
# This is an emptyDir-backed disposable database; never store passwords in Git.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-nationalparks-bootstrap
  labels:
    app: national-parks-app
    app.kubernetes.io/part-of: national-parks-app
data:
  create-app-user.js: |
    // Executed only when the modern MongoDB image initializes an empty database.
    // Credentials come from the student's Secret via container environment.
    const database = process.env.MONGODB_DATABASE;
    const username = process.env.MONGODB_USER;
    const password = process.env.MONGODB_PASSWORD;
    if (!database || !username || !password) {
      throw new Error('Missing database name or application credentials');
    }
    db.getSiblingDB(database).createUser({
      user: username,
      pwd: password,
      roles: [{role: 'readWrite', db: database}]
    });
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-nationalparks
  labels:
    app: national-parks-app
    component: mongodb-nationalparks
    app.kubernetes.io/part-of: national-parks-app
    app.kubernetes.io/name: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-nationalparks
  template:
    metadata:
      labels:
        app: mongodb-nationalparks
        component: mongodb-nationalparks
        app.kubernetes.io/part-of: national-parks-app
        app.kubernetes.io/name: mongodb
    spec:
      containers:
        - name: mongodb
          image: quay.io/mongodb/mongodb-community-server:8.0.32-ubi9-slim
          imagePullPolicy: IfNotPresent
          ports:
            - name: mongodb
              containerPort: 27017
              protocol: TCP
          envFrom:
            - secretRef:
                name: nationalparks-mongodb-parameters
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: nationalparks-admin
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nationalparks-mongodb-parameters
                  key: MONGODB_ADMIN_PASSWORD
            - name: MONGO_INITDB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: nationalparks-mongodb-parameters
                  key: MONGODB_DATABASE
          readinessProbe:
            tcpSocket:
              port: mongodb
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: modern-data
              mountPath: /data/db
            - name: app-user-bootstrap
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: modern-data
          emptyDir: {}
        - name: app-user-bootstrap
          configMap:
            name: mongodb-nationalparks-bootstrap
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-nationalparks
  labels:
    app: national-parks-app
    component: mongodb-nationalparks
    app.kubernetes.io/part-of: national-parks-app
spec:
  type: ClusterIP
  selector:
    app: mongodb-nationalparks
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27018
      protocol: TCP
