# Generate per-namespace MongoDB credentials on first GitOps sync.
# The Job is idempotent and never logs the generated passwords. It creates
# a Secret in its OWN namespace; no student cluster-admin privileges needed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nationalparks-credentials-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nationalparks-credentials-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [nationalparks-mongodb-parameters]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nationalparks-credentials-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
subjects:
  - kind: ServiceAccount
    name: nationalparks-credentials-bootstrap
    # Namespace defaults to the containing RoleBinding namespace.
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nationalparks-credentials-bootstrap
---
apiVersion: batch/v1
kind: Job
metadata:
  name: nationalparks-credentials-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    spec:
      serviceAccountName: nationalparks-credentials-bootstrap
      restartPolicy: OnFailure
      containers:
        - name: create-credentials
          # Red Hat CLI image: test pull access in the lab preflight.
          image: registry.redhat.io/openshift4/ose-cli:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-euc"]
          args:
            - |
              if oc get secret nationalparks-mongodb-parameters -n "$POD_NAMESPACE" >/dev/null 2>&1; then
                echo "MongoDB Secret already exists in this namespace; preserving it."
                exit 0
              fi
              # Two independently generated, random 256-bit passwords.
              db_password="$(od -An -N32 -tx1 /dev/urandom | tr -d ' \n')"
              admin_password="$(od -An -N32 -tx1 /dev/urandom | tr -d ' \n')"
              oc create secret generic nationalparks-mongodb-parameters \
                -n "$POD_NAMESPACE" \
                --from-literal=DATABASE_SERVICE_NAME=mongodb-nationalparks \
                --from-literal=MONGODB_DATABASE=mongodb \
                --from-literal=MONGODB_USER=mongodb \
                --from-literal=MONGODB_PASSWORD="$db_password" \
                --from-literal=MONGODB_ADMIN_PASSWORD="$admin_password" >/dev/null
              echo "MongoDB credentials generated and stored as a Kubernetes Secret."
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
