apiVersion: apps/v1
kind: Deployment
metadata:
  name: parksmap
  labels:
    app: national-parks-app
    component: parksmap
    app.kubernetes.io/part-of: national-parks-app
  annotations:
    # The legacy ParksMap image crashes if it discovers a Service without
    # ready Endpoints. Start after the nationalparks backend in sync wave 1.
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parksmap
  template:
    metadata:
      labels:
        app: parksmap
        component: parksmap
        role: frontend
        app.kubernetes.io/part-of: national-parks-app
    spec:
      serviceAccountName: parksmap-discovery
      containers:
        - name: parksmap
          image: quay.io/openshiftroadshow/parksmap:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # This legacy Java 8/Spring Boot image was OOMKilled with a 512Mi
          # container limit and unconstrained heap. Cap Java heap and
          # Metaspace to leave memory for native/JIT/thread overhead.
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms64m -Xmx256m -XX:MaxMetaspaceSize=160m -XX:+UseSerialGC"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            # Low requests keep both namespaces schedulable; JVM needs
            # more than 512Mi at startup, so retain a 768Mi hard cap.
            requests:
              cpu: 75m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: parksmap
  labels:
    app: national-parks-app
    component: parksmap
    app.kubernetes.io/part-of: national-parks-app
spec:
  selector:
    app: parksmap
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: parksmap
  labels:
    app: national-parks-app
    component: parksmap
    app.kubernetes.io/part-of: national-parks-app
spec:
  to:
    kind: Service
    name: parksmap
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
