# Main Module 2 Application for the user-xtm9x student environment.
# For any other student, replace the two namespaces and Gitea URL.
# Paste into OpenShift Console > GitOps > Applications > Create Application.
# Application CR stays in -demo; the full stack deploys into -gitops.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: national-parks-settings
  namespace: user-xtm9x-demo
spec:
  project: default
  source:
    repoURL: https://gitea-user-xtm9x-demo.apps.ocp.dzzzx.sandbox3311.opentlc.com/user-xtm9x/openshift-5-container.git
    targetRevision: main
    path: content/modules/ROOT/examples/module02-gitops
  destination:
    server: https://kubernetes.default.svc
    namespace: user-xtm9x-gitops
  # ImageStreamTag triggers modify this one backend image after the Build.
  # Respect this field during diff AND sync to avoid self-heal fighting it.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: nationalparks
      jsonPointers:
        - /spec/template/spec/containers/0/image
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
