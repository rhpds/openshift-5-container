name: modules
title: "Operating Applications on OpenShift 5: Platform Engineering, AI & GitOps"
version: ~
nav:
  - modules/ROOT/nav.adoc

asciidoc:
  attributes:
    experimental: true
    ocp_version: '5.0.0'
    page-pagination: true
    guid: '%GUID%'
    # Showroom injects the student-specific `user` and `password` attributes.
    # Do not define competing lab_user/lab_password defaults here: a literal
    # %GUID% fallback would appear in the published credentials table.
    ssh_user: lab-user
    ssh_password: changeme
    openshift_console_url: 'https://console-openshift-console.apps.cluster-%GUID%.example.com'
    openshift_cluster_ingress_domain: 'apps.cluster-%GUID%.example.com'
