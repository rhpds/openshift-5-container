name: github pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "site.yml"
      - ".github/workflows/gh-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
      - name: configure pages
        uses: actions/configure-pages@v6.0.0
      - name: setup node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.21.0
      - name: install antora
        run: npm install --global @antora/cli@3.2.1 @antora/site-generator@3.2.1 @sntke/antora-mermaid-extension @andrew-jones/antora-tabs-extension
      - name: download Showroom UI bundle
        run: |
          mkdir -p .cache/ui
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 3 \
            --connect-timeout 20 --max-time 120 \
            --output .cache/ui/ui-bundle.zip \
            https://github.com/rhpds/rhdp_showroom_theme/releases/download/v2.0.3/ui-bundle.zip
          unzip -t .cache/ui/ui-bundle.zip >/dev/null
      - name: antora generate
        run: antora generate --ui-bundle-url ./.cache/ui/ui-bundle.zip --stacktrace site.yml
      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: www
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: deploy github pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
